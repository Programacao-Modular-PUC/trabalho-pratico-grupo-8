<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pousadas de Maraú - Aluguéis</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

    <header class="cabecalho">
        <div class="logo">Pousadas de Maraú</div>
        <nav class="menu">
            <a href="proprietario.html">Minhas residências</a>
            <a href="alugueis.html" class="ativo">Aluguéis</a>
            <a href="../acesso/login.html" onclick="logout()">Sair</a>
        </nav>
        <div class="usuario">Proprietário</div>
    </header>

    <main class="conteudo">

        <h2 class="titulo-pagina">Aluguéis das minhas residências</h2>
        <p class="subtitulo-pagina">Reservas e aluguéis em todas as residências cadastradas.</p>

        <table class="tabela">
            <thead>
                <tr>
                    <th>Nº</th>
                    <th>Residência</th>
                    <th>Quarto</th>
                    <th>Cliente</th>
                    <th>Entrada</th>
                    <th>Saída</th>
                    <th>Total</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="lista"></tbody>
        </table>

    </main>

    <script src="../js/app.js"></script>
    <script>
        function residenciaTexto(a) {
            const r = a.quarto.residencia;
            if (!r) {
                return "-";
            }
            let texto = "";
            if (r.endereco) {
                texto = r.endereco;
            }
            if (r.bairro) {
                texto += " - " + r.bairro;
            }
            return texto;
        }

        async function carregar() {
            const lista = await getJSON("/alugueis");
            const tbody = document.getElementById("lista");
            if (lista.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8">Nenhum aluguel registrado.</td></tr>';
                return;
            }
            let html = "";
            for (let i = 0; i < lista.length; i++) {
                const a = lista[i];
                let cliente = "-";
                if (a.cliente) {
                    cliente = a.cliente.nome;
                }
                let status = '<span class="selo selo-confirmada">Ativo</span>';
                if (a.cancelado) {
                    status = '<span class="selo selo-ocupado">Cancelado</span>';
                }
                html += `
                <tr>
                    <td>${a.id}</td>
                    <td>${residenciaTexto(a)}</td>
                    <td>${a.quarto.id} · ${a.quarto.tipo}</td>
                    <td>${cliente}</td>
                    <td>${formatarData(a.dataEntrada)}</td>
                    <td>${formatarData(a.dataSaida)}</td>
                    <td>${moeda(a.valorFinal)}</td>
                    <td>${status}</td>
                </tr>`;
            }
            tbody.innerHTML = html;
        }

        carregar();
    </script>

</body>
</html>
