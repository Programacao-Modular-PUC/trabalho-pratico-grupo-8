<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pousadas de Maraú - Área do Proprietário</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

    <header class="cabecalho">
        <div class="logo">Pousadas de Maraú</div>
        <nav class="menu">
            <a href="proprietario.html" class="ativo">Minhas residências</a>
            <a href="alugueis.html">Aluguéis</a>
            <a href="../acesso/login.html" onclick="logout()">Sair</a>
        </nav>
        <div class="usuario">Proprietário</div>
    </header>

    <main class="conteudo">

        <div class="topo-secao">
            <h2>Minhas residências</h2>
            <a href="nova-residencia.html" class="botao botao-principal">+ Nova residência</a>
        </div>

        <table class="tabela">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Endereço</th>
                    <th>Bairro</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="lista"></tbody>
        </table>

    </main>

    <script src="../js/app.js"></script>
    <script>
        async function carregar() {
            const residencias = await getJSON("/residencias");
            const tbody = document.getElementById("lista");
            if (!residencias.length) {
                tbody.innerHTML = '<tr><td colspan="4">Nenhuma residência cadastrada.</td></tr>';
                return;
            }
            tbody.innerHTML = residencias.map(r => `
                <tr>
                    <td>${r.id}</td>
                    <td>${r.endereco || ""}${r.numero ? ", " + r.numero : ""}</td>
                    <td>${r.bairro || ""}</td>
                    <td class="botoes">
                        <a href="novo-quarto.html?residenciaId=${r.id}" class="botao">+ Quarto</a>
                        <a href="../cliente/quartos.html?residenciaId=${r.id}" class="botao">Ver quartos</a>
                    </td>
                </tr>`).join("");
        }

        carregar();
    </script>

</body>
</html>
