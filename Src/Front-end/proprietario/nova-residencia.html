<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pousadas de Maraú - Nova Residência</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

    <header class="cabecalho">
        <div class="logo">Pousadas de Maraú</div>
        <nav class="menu">
            <a href="proprietario.html" class="ativo">Minhas residências</a>
            <a href="alugueis.html">Aluguéis</a>
            <a href="../acesso/login.html" onclick="logout()">Sair</a>
        </nav>
        <div class="usuario">Proprietário</div>
    </header>

    <main class="conteudo">

        <div class="caixa">
            <div class="caixa-titulo">Nova residência</div>

            <form class="formulario" id="form-residencia">

                <div class="linha">
                    <div class="campo">
                        <label for="rua">Rua</label>
                        <input type="text" id="rua" name="rua" required>
                    </div>
                    <div class="campo">
                        <label for="numero">Número</label>
                        <input type="text" id="numero" name="numero" required>
                    </div>
                </div>

                <div class="linha-quatro">
                    <div class="campo">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" name="bairro" required>
                    </div>
                    <div class="campo">
                        <label for="cep">CEP</label>
                        <input type="text" id="cep" name="cep" placeholder="00000-000" required>
                    </div>
                    <div class="campo">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="cidade" value="Maraú" required>
                    </div>
                    <div class="campo">
                        <label for="uf">UF</label>
                        <input type="text" id="uf" name="uf" value="BA" maxlength="2" required>
                    </div>
                </div>

                <div class="linha">
                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" name="telefone"
                               placeholder="(00) 00000-0000" required>
                    </div>
                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                </div>

                <div id="erro" class="mensagem mensagem-erro" style="display:none;"></div>

                <div class="acoes">
                    <button type="submit" class="botao botao-principal">Salvar</button>
                    <a href="proprietario.html" class="botao">Cancelar</a>
                </div>

            </form>
        </div>

    </main>

    <script src="../js/app.js"></script>
    <script>
        document.getElementById("form-residencia").addEventListener("submit", async function (e) {
            e.preventDefault();
            const erro = document.getElementById("erro");
            erro.style.display = "none";
            try {
                await postJSON("/residencias", {
                    endereco: document.getElementById("rua").value,
                    numero: document.getElementById("numero").value,
                    bairro: document.getElementById("bairro").value,
                    cep: document.getElementById("cep").value,
                    telefone: document.getElementById("telefone").value,
                    email: document.getElementById("email").value
                });
                window.location.href = "proprietario.html";
            } catch (ex) {
                erro.textContent = ex.message;
                erro.style.display = "block";
            }
        });
    </script>

</body>
</html>
