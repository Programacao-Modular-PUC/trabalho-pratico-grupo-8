<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pousadas de Maraú - Entrar</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

    <div class="tela-centralizada">
        <div class="painel-login">
            <div class="topo">Pousadas de Maraú · Entrar</div>

            <div class="corpo">

                <form class="formulario" action="../cliente/residencias.html" method="get">
                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email"
                               placeholder="voce@exemplo.com" required>
                    </div>

                    <div class="campo">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha"
                               placeholder="********" required>
                    </div>

                    <div>
                        <a href="#">Esqueci minha senha</a>
                    </div>

                    <div class="acoes">
                        <button type="submit" class="botao botao-principal">Entrar</button>
                        <a href="cadastro.html" class="botao">Criar conta</a>
                    </div>
                </form>

            </div>
        </div>
    </div>

</body>
</html>
