<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pousadas de Maraú - Criar Conta</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

    <div class="conteudo">
        <div class="caixa">
            <div class="caixa-titulo">Criar conta</div>

            <form class="formulario" id="form-cadastro">

                <div class="linha">
                    <div class="campo">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>
                    <div class="campo">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf"
                               placeholder="000.000.000-00" maxlength="14" required>
                    </div>
                </div>

                <div class="linha">
                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" name="telefone"
                               placeholder="(00) 00000-0000" required>
                    </div>
                </div>

                <div class="campo">
                    <label for="endereco">Endereço</label>
                    <input type="text" id="endereco" name="endereco"
                           placeholder="Rua, número" required>
                </div>

                <div class="linha">
                    <div class="campo">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" required>
                    </div>
                    <div class="campo">
                        <label for="confirmar">Confirmar senha</label>
                        <input type="password" id="confirmar" name="confirmar" required>
                    </div>
                </div>

                <div id="aviso" class="mensagem mensagem-erro" style="display:none;">
                    As senhas não conferem.
                </div>
                <div id="erro" class="mensagem mensagem-erro" style="display:none;"></div>

                <div class="acoes">
                    <button type="submit" class="botao botao-principal">Cadastrar</button>
                    <a href="login.html" class="botao">Cancelar</a>
                </div>

            </form>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        document.getElementById("form-cadastro").addEventListener("submit", async function (e) {
            e.preventDefault();
            const aviso = document.getElementById("aviso");
            const erro = document.getElementById("erro");
            aviso.style.display = "none";
            erro.style.display = "none";

            if (document.getElementById("senha").value !== document.getElementById("confirmar").value) {
                aviso.style.display = "block";
                return;
            }

            try {
                await postJSON("/cliente", {
                    nome: valor("nome"),
                    cpf: valor("cpf"),
                    email: valor("email"),
                    telefone: valor("telefone"),
                    endereco: valor("endereco"),
                    senha: valor("senha")
                });
                window.location.href = "login.html";
            } catch (ex) {
                erro.textContent = ex.message;
                erro.style.display = "block";
            }
        });

        function valor(id) {
            return document.getElementById(id).value;
        }
    </script>

</body>
</html>
