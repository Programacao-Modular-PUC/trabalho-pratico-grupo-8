<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pousadas de Maraú - Quartos</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

    <header class="cabecalho">
        <div class="logo">Pousadas de Maraú</div>
        <nav class="menu">
            <a href="residencias.html">Residências</a>
            <a href="minhas-reservas.html">Minhas reservas</a>
            <a href="historico.html">Histórico</a>
            <a href="../acesso/login.html" onclick="logout()">Sair</a>
        </nav>
        <div class="usuario"></div>
    </header>

    <main class="conteudo">

        <a href="residencias.html" class="voltar">← voltar</a>

        <h2 class="titulo-pagina" id="titulo">Quartos</h2>
        <p class="subtitulo-pagina" id="subtitulo"></p>

        <form class="filtros" id="form-filtro">
            <div class="campo">
                <label for="tipo">Tipo de quarto</label>
                <select id="tipo" name="tipo">
                    <option value="">Todos</option>
                    <option value="individual">Individual</option>
                    <option value="duplo">Duplo</option>
                    <option value="familia">Família</option>
                </select>
            </div>
            <button type="submit" class="botao botao-principal">Filtrar</button>
        </form>

        <table class="tabela">
            <thead>
                <tr>
                    <th>Nº</th>
                    <th>Tipo</th>
                    <th>Ar</th>
                    <th>Hidro</th>
                    <th>Valor base</th>
                    <th>Capacidade</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="lista"></tbody>
        </table>

    </main>

    <script src="../js/app.js"></script>
    <script>
        mostrarUsuario();
        const residenciaId = parametro("residenciaId");
        const tipoSelecionado = parametro("tipo") || "";
        document.getElementById("tipo").value = tipoSelecionado;

        document.getElementById("form-filtro").addEventListener("submit", function (e) {
            e.preventDefault();
            const tipo = document.getElementById("tipo").value;
            let url = "quartos.html?";
            if (residenciaId) url += "residenciaId=" + residenciaId + "&";
            if (tipo) url += "tipo=" + tipo;
            window.location.href = url;
        });

        async function carregar() {
            if (residenciaId) {
                const r = await getJSON("/residencias/" + residenciaId);
                document.getElementById("titulo").textContent = (r.endereco || "Residência") + (r.numero ? ", " + r.numero : "");
                document.getElementById("subtitulo").textContent = [r.bairro, r.cep, r.telefone, r.email].filter(Boolean).join(" · ");
            }
            let url = "/quartos?";
            if (residenciaId) url += "residenciaId=" + residenciaId + "&";
            if (tipoSelecionado) url += "tipo=" + tipoSelecionado;
            const quartos = await getJSON(url);
            const tbody = document.getElementById("lista");
            if (!quartos.length) {
                tbody.innerHTML = '<tr><td colspan="7">Nenhum quarto encontrado.</td></tr>';
                return;
            }
            tbody.innerHTML = quartos.map(q => `
                <tr>
                    <td>${q.id}</td>
                    <td>${q.tipo}</td>
                    <td>${sim(q.possuiAR)}</td>
                    <td>${sim(q.possuiHidro)}</td>
                    <td>${moeda(q.valorBase)}</td>
                    <td>${q.capacidade}</td>
                    <td class="botoes"><a href="reserva.html?quartoId=${q.id}" class="botao botao-principal">Alugar</a></td>
                </tr>`).join("");
        }

        carregar();
    </script>

</body>
</html>
