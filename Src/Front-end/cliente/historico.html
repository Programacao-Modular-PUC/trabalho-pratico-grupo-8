<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pousadas de Maraú - Histórico</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

    <header class="cabecalho">
        <div class="logo">Pousadas de Maraú</div>
        <nav class="menu">
            <a href="residencias.html">Residências</a>
            <a href="minhas-reservas.html">Minhas reservas</a>
            <a href="historico.html" class="ativo">Histórico</a>
            <a href="../acesso/login.html" onclick="logout()">Sair</a>
        </nav>
        <div class="usuario"></div>
    </header>

    <main class="conteudo">

        <h2 class="titulo-pagina">Histórico de hospedagens</h2>
        <p class="subtitulo-pagina">Todos os aluguéis já realizados.</p>

        <table class="tabela">
            <thead>
                <tr>
                    <th>Nº</th>
                    <th>Residência</th>
                    <th>Quarto</th>
                    <th>Entrada</th>
                    <th>Saída</th>
                    <th>Diárias</th>
                    <th>Total</th>
                    <th>Situação</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="lista"></tbody>
        </table>

    </main>

    <script src="../js/app.js"></script>
    <script>
        const usuario = exigirLogin();
        mostrarUsuario();

        function residenciaTexto(a) {
            const r = a.quarto.residencia;
            return r ? (r.endereco || "") + (r.bairro ? " - " + r.bairro : "") : "-";
        }

        async function carregar() {
            const lista = await getJSON("/alugueis/cliente/" + usuario.id);
            const tbody = document.getElementById("lista");
            if (!lista.length) {
                tbody.innerHTML = '<tr><td colspan="9">Nenhuma hospedagem realizada.</td></tr>';
                return;
            }
            tbody.innerHTML = lista.map(a => `
                <tr>
                    <td>${a.id}</td>
                    <td>${residenciaTexto(a)}</td>
                    <td>${a.quarto.id} · ${a.quarto.tipo}</td>
                    <td>${formatarData(a.dataEntrada)}</td>
                    <td>${formatarData(a.dataSaida)}</td>
                    <td>${a.numeroDiarias}</td>
                    <td>${moeda(a.valorFinal)}</td>
                    <td>${a.cancelado ? '<span class="selo selo-ocupado">Cancelado</span>' : '<span class="selo selo-confirmada">Concluído</span>'}</td>
                    <td><a href="recibo.html?aluguelId=${a.id}" class="botao">Recibo</a></td>
                </tr>`).join("");
        }

        carregar();
    </script>

</body>
</html>
