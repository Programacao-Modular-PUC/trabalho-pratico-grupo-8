<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pousadas de Maraú - Pagamento</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

    <header class="cabecalho">
        <div class="logo">Pousadas de Maraú</div>
        <nav class="menu">
            <a href="residencias.html">Residências</a>
            <a href="minhas-reservas.html">Minhas reservas</a>
            <a href="historico.html">Histórico</a>
            <a href="../acesso/login.html" onclick="logout()">Sair</a>
        </nav>
        <div class="usuario"></div>
    </header>

    <main class="conteudo">

        <div class="caixa">
            <div class="caixa-titulo">Pagamento</div>

            <div class="dois-paineis">

                <form class="formulario" id="form-pagamento">
                    <div class="campo">
                        <label for="forma">Forma de pagamento</label>
                        <select id="forma" name="forma" required>
                            <option value="">Selecione</option>
                            <option value="Pix">Pix</option>
                            <option value="Cartão de crédito">Cartão de crédito</option>
                            <option value="Cartão de débito">Cartão de débito</option>
                            <option value="Boleto">Boleto</option>
                        </select>
                    </div>

                    <div class="linha-tres">
                        <div class="campo">
                            <label for="numero">Número do cartão</label>
                            <input type="text" id="numero" name="numero"
                                   placeholder="0000 0000 0000 0000" maxlength="19">
                        </div>
                        <div class="campo">
                            <label for="validade">Validade</label>
                            <input type="text" id="validade" name="validade"
                                   placeholder="MM/AA" maxlength="5">
                        </div>
                        <div class="campo">
                            <label for="cvv">CVV</label>
                            <input type="text" id="cvv" name="cvv"
                                   placeholder="000" maxlength="4">
                        </div>
                    </div>

                    <div class="campo">
                        <label for="nome-cartao">Nome no cartão</label>
                        <input type="text" id="nome-cartao" name="nome-cartao">
                    </div>

                    <div class="acoes">
                        <button type="submit" class="botao botao-principal">Pagar</button>
                        <a href="#" class="botao" id="cancelar">Cancelar</a>
                    </div>
                </form>

                <div class="resumo" id="resumo"></div>

            </div>
        </div>

    </main>

    <script src="../js/app.js"></script>
    <script>
        mostrarUsuario();
        const aluguelId = parametro("aluguelId");
        document.getElementById("cancelar").href = "aluguel.html?aluguelId=" + aluguelId;

        document.getElementById("form-pagamento").addEventListener("submit", function (e) {
            e.preventDefault();
            const forma = document.getElementById("forma").value;
            window.location.href = "recibo.html?aluguelId=" + aluguelId + "&forma=" + encodeURIComponent(forma);
        });

        async function carregar() {
            const a = await getJSON("/alugueis/" + aluguelId);
            let valorDiaria = 0;
            if (a.numeroDiarias) {
                valorDiaria = a.valorFinal / a.numeroDiarias;
            }
            document.getElementById("resumo").innerHTML = `
                <div class="item"><span>Diárias</span><strong>${a.numeroDiarias}</strong></div>
                <div class="item"><span>Valor por diária</span><span>${moeda(valorDiaria)}</span></div>
                <div class="item total"><span>Total</span><span>${moeda(a.valorFinal)}</span></div>`;
        }

        carregar();
    </script>

</body>
</html>
