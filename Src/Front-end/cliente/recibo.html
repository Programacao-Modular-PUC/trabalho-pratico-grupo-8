<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pousadas de Maraú - Recibo</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

    <header class="cabecalho">
        <div class="logo">Pousadas de Maraú</div>
        <nav class="menu">
            <a href="residencias.html">Residências</a>
            <a href="minhas-reservas.html">Minhas reservas</a>
            <a href="historico.html">Histórico</a>
            <a href="../acesso/login.html" onclick="logout()">Sair</a>
        </nav>
        <div class="usuario"></div>
    </header>

    <main class="conteudo">

        <div class="mensagem mensagem-sucesso" style="text-align: center;">
            <strong>Pagamento confirmado</strong>
        </div>

        <div class="recibo" id="recibo"></div>

        <div class="acoes" style="justify-content: center; margin-top: 20px;">
            <button type="button" class="botao" onclick="window.print()">Imprimir</button>
            <button type="button" class="botao" onclick="window.print()">Baixar PDF</button>
            <a href="residencias.html" class="botao botao-principal">Voltar ao início</a>
        </div>

    </main>

    <script src="../js/app.js"></script>
    <script>
        mostrarUsuario();
        const aluguelId = parametro("aluguelId");
        const forma = parametro("forma") || "—";

        async function carregar() {
            const a = await getJSON("/alugueis/" + aluguelId);
            const residencia = a.quarto.residencia;
            const valorDiaria = a.numeroDiarias ? a.valorFinal / a.numeroDiarias : 0;
            document.getElementById("recibo").innerHTML = `
                <div class="titulo">Pousadas de Maraú — Recibo de Hospedagem</div>
                <div class="linha-recibo"><span>Recibo nº:</span><strong>${a.id}</strong></div>
                <div class="linha-recibo"><span>Cliente:</span><span>${a.cliente.nome || ""}</span></div>
                <div class="linha-recibo"><span>Residência:</span><span>${residencia ? (residencia.endereco || "") + " · " + (residencia.bairro || "") : "-"}</span></div>
                <div class="linha-recibo"><span>Quarto:</span><span>${a.quarto.id} · ${a.quarto.tipo}</span></div>
                <div class="linha-recibo"><span>Data e horário de entrada:</span><strong>${formatarData(a.dataEntrada)}</strong></div>
                <div class="linha-recibo"><span>Data e horário de saída:</span><strong>${formatarData(a.dataSaida)}</strong></div>
                <div class="linha-recibo"><span>Número de diárias:</span><strong>${a.numeroDiarias}</strong></div>
                <div class="linha-recibo"><span>Valor da diária:</span><span>${moeda(valorDiaria)}</span></div>
                <div class="linha-recibo"><span>Forma de pagamento:</span><span>${forma}</span></div>
                <div class="linha-recibo total"><span>Total a pagar:</span><span>${moeda(a.valorFinal)}</span></div>`;
        }

        carregar();
    </script>

</body>
</html>
