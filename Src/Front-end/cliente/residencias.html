<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pousadas de Maraú - Residências</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

    <header class="cabecalho">
        <div class="logo">Pousadas de Maraú</div>
        <nav class="menu">
            <a href="residencias.html" class="ativo">Residências</a>
            <a href="minhas-reservas.html">Minhas reservas</a>
            <a href="historico.html">Histórico</a>
            <a href="../acesso/login.html" onclick="logout()">Sair</a>
        </nav>
        <div class="usuario"></div>
    </header>

    <main class="conteudo">

        <form class="filtros" id="form-filtro">
            <div class="campo">
                <label for="bairro">Bairro</label>
                <input type="text" id="bairro" name="bairro" placeholder="Ex.: Centro">
            </div>
            <button type="submit" class="botao botao-principal">Buscar</button>
        </form>

        <div id="lista"></div>

    </main>

    <script src="../js/app.js"></script>
    <script>
        mostrarUsuario();
        let residencias = [];

        function render(lista) {
            const div = document.getElementById("lista");
            if (!lista.length) {
                div.innerHTML = "<p>Nenhuma residência cadastrada.</p>";
                return;
            }
            div.innerHTML = lista.map(r => `
                <div class="card-residencia">
                    <div class="foto">[ foto ]</div>
                    <h3>${r.endereco || "Residência"}${r.numero ? ", " + r.numero : ""}</h3>
                    <p class="endereco">${r.bairro || ""}</p>
                    <div class="acoes">
                        <a href="quartos.html?residenciaId=${r.id}" class="botao">Ver quartos</a>
                    </div>
                </div>`).join("");
        }

        document.getElementById("form-filtro").addEventListener("submit", function (e) {
            e.preventDefault();
            const termo = document.getElementById("bairro").value.toLowerCase();
            render(residencias.filter(r => (r.bairro || "").toLowerCase().includes(termo)));
        });

        async function carregar() {
            residencias = await getJSON("/residencias");
            render(residencias);
        }

        carregar();
    </script>

</body>
</html>
