<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pousadas de Maraú - Residências</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

    <header class="cabecalho">
        <div class="logo">Pousadas de Maraú</div>
        <nav class="menu">
            <a href="residencias.html" class="ativo">Residências</a>
            <a href="minhas-reservas.html">Minhas reservas</a>
            <a href="historico.html">Histórico</a>
            <a href="../acesso/login.html" onclick="logout()">Sair</a>
        </nav>
        <div class="usuario"></div>
    </header>

    <main class="conteudo">

        <form class="filtros" id="form-filtro">
            <div class="campo">
                <label for="bairro">Bairro</label>
                <input type="text" id="bairro" name="bairro" placeholder="Ex.: Centro">
            </div>
            <button type="submit" class="botao botao-principal">Buscar</button>
        </form>

        <div id="lista"></div>

    </main>

    <script src="../js/app.js"></script>
    <script>
        mostrarUsuario();
        let residencias = [];

        function render(lista) {
            const div = document.getElementById("lista");
            if (lista.length === 0) {
                div.innerHTML = "<p>Nenhuma residência cadastrada.</p>";
                return;
            }
            let html = "";
            for (let i = 0; i < lista.length; i++) {
                const r = lista[i];
                let nome = "Residência";
                if (r.endereco) {
                    nome = r.endereco;
                }
                if (r.numero) {
                    nome = nome + ", " + r.numero;
                }
                let bairro = "";
                if (r.bairro) {
                    bairro = r.bairro;
                }
                html += `
                <div class="card-residencia">
                    <div class="foto">[ foto ]</div>
                    <h3>${nome}</h3>
                    <p class="endereco">${bairro}</p>
                    <div class="acoes">
                        <a href="quartos.html?residenciaId=${r.id}" class="botao">Ver quartos</a>
                    </div>
                </div>`;
            }
            div.innerHTML = html;
        }

        function filtrar(e) {
            e.preventDefault();
            const termo = document.getElementById("bairro").value.toLowerCase();
            const filtradas = [];
            for (let i = 0; i < residencias.length; i++) {
                let bairro = "";
                if (residencias[i].bairro) {
                    bairro = residencias[i].bairro.toLowerCase();
                }
                if (bairro.includes(termo)) {
                    filtradas.push(residencias[i]);
                }
            }
            render(filtradas);
        }
        document.getElementById("form-filtro").addEventListener("submit", filtrar);

        async function carregar() {
            residencias = await getJSON("/residencias");
            render(residencias);
        }

        carregar();
    </script>

</body>
</html>
