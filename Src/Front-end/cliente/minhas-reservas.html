<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pousadas de Maraú - Minhas Reservas</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

    <header class="cabecalho">
        <div class="logo">Pousadas de Maraú</div>
        <nav class="menu">
            <a href="residencias.html">Residências</a>
            <a href="minhas-reservas.html" class="ativo">Minhas reservas</a>
            <a href="historico.html">Histórico</a>
            <a href="../acesso/login.html" onclick="logout()">Sair</a>
        </nav>
        <div class="usuario"></div>
    </header>

    <main class="conteudo">

        <h2 class="titulo-pagina">Reservas ativas</h2>

        <table class="tabela">
            <thead>
                <tr>
                    <th>Nº</th>
                    <th>Residência</th>
                    <th>Quarto</th>
                    <th>Entrada</th>
                    <th>Saída</th>
                    <th>Status</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="ativas"></tbody>
        </table>

        <h2 class="titulo-pagina" style="margin-top: 30px;">Histórico recente</h2>

        <table class="tabela">
            <thead>
                <tr>
                    <th>Nº</th>
                    <th>Residência</th>
                    <th>Quarto</th>
                    <th>Entrada</th>
                    <th>Saída</th>
                    <th>Diárias</th>
                    <th>Total</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="historico"></tbody>
        </table>

        <p style="margin-top: 15px;">
            <a href="historico.html">Ver histórico completo →</a>
        </p>

    </main>

    <script src="../js/app.js"></script>
    <script>
        const usuario = exigirLogin();
        mostrarUsuario();

        function residenciaTexto(a) {
            const r = a.quarto.residencia;
            return r ? (r.endereco || "") + (r.bairro ? " - " + r.bairro : "") : "-";
        }

        async function cancelar(id) {
            if (!confirm("Deseja cancelar este aluguel?")) return;
            await putJSON("/alugueis/" + id + "/cancelar");
            carregar();
        }

        async function carregar() {
            const lista = await getJSON("/alugueis/cliente/" + usuario.id);
            const ativas = lista.filter(a => !a.cancelado);

            document.getElementById("ativas").innerHTML = ativas.length ? ativas.map(a => `
                <tr>
                    <td>${a.id}</td>
                    <td>${residenciaTexto(a)}</td>
                    <td>${a.quarto.id} · ${a.quarto.tipo}</td>
                    <td>${formatarData(a.dataEntrada)}</td>
                    <td>${formatarData(a.dataSaida)}</td>
                    <td><span class="selo selo-confirmada">Confirmada</span></td>
                    <td class="botoes">
                        <a href="aluguel.html?aluguelId=${a.id}" class="botao">Ver</a>
                        <a href="#" class="botao" onclick="cancelar(${a.id});return false;">Cancelar</a>
                    </td>
                </tr>`).join("") : '<tr><td colspan="7">Nenhuma reserva ativa.</td></tr>';

            document.getElementById("historico").innerHTML = lista.length ? lista.map(a => `
                <tr>
                    <td>${a.id}</td>
                    <td>${residenciaTexto(a)}</td>
                    <td>${a.quarto.id} · ${a.quarto.tipo}</td>
                    <td>${formatarData(a.dataEntrada)}</td>
                    <td>${formatarData(a.dataSaida)}</td>
                    <td>${a.numeroDiarias}</td>
                    <td>${moeda(a.valorFinal)}</td>
                    <td><a href="recibo.html?aluguelId=${a.id}" class="botao">Recibo</a></td>
                </tr>`).join("") : '<tr><td colspan="8">Sem histórico.</td></tr>';
        }

        carregar();
    </script>

</body>
</html>
