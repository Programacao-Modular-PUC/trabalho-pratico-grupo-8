<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pousadas de Maraú - Reserva</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

    <header class="cabecalho">
        <div class="logo">Pousadas de Maraú</div>
        <nav class="menu">
            <a href="residencias.html">Residências</a>
            <a href="minhas-reservas.html">Minhas reservas</a>
            <a href="historico.html">Histórico</a>
            <a href="../acesso/login.html" onclick="logout()">Sair</a>
        </nav>
        <div class="usuario"></div>
    </header>

    <main class="conteudo">

        <a href="#" class="voltar" onclick="history.back();return false;">← voltar</a>

        <h2 class="titulo-pagina" id="titulo">Quarto</h2>

        <div class="faixa-info" id="info"></div>

        <div class="dois-paineis">

            <div class="caixa">
                <div class="caixa-titulo">Detalhes do quarto</div>
                <div id="detalhes"></div>
            </div>

            <div>
                <form class="resumo" id="form-reserva">
                    <div class="campo" style="margin-bottom: 12px;">
                        <label for="entrada">Entrada</label>
                        <input type="datetime-local" id="entrada" required>
                    </div>

                    <div class="campo" style="margin-bottom: 12px;">
                        <label for="saida">Saída</label>
                        <input type="datetime-local" id="saida" required>
                    </div>

                    <div class="campo" style="margin-bottom: 12px;">
                        <label for="hospedes">Hóspedes</label>
                        <input type="number" id="hospedes" min="1" value="1" required>
                    </div>

                    <div class="campo" style="margin-bottom: 12px;">
                        <label><input type="checkbox" id="berco"> Solicitar berço</label>
                    </div>

                    <div id="erro" class="mensagem mensagem-erro" style="display:none;"></div>

                    <div class="acoes" style="margin-top: 15px;">
                        <button type="submit" class="botao botao-principal">Alugar</button>
                    </div>
                </form>
            </div>

        </div>

    </main>

    <script src="../js/app.js"></script>
    <script>
        const usuario = exigirLogin();
        mostrarUsuario();
        const quartoId = parametro("quartoId");

        document.getElementById("form-reserva").addEventListener("submit", async function (e) {
            e.preventDefault();
            const erro = document.getElementById("erro");
            erro.style.display = "none";
            try {
                const aluguel = await postJSON("/alugueis/cadastrar", {
                    clienteId: usuario.id,
                    quartoId: Number(quartoId),
                    dataEntrada: document.getElementById("entrada").value,
                    dataSaida: document.getElementById("saida").value,
                    numeroHospedes: Number(document.getElementById("hospedes").value),
                    clienteSolicitouBerco: document.getElementById("berco").checked
                });
                window.location.href = "aluguel.html?aluguelId=" + aluguel.id;
            } catch (ex) {
                erro.textContent = ex.message;
                erro.style.display = "block";
            }
        });

        async function carregar() {
            const quarto = await getJSON("/quartos/" + quartoId);
            const residencia = quarto.residencia;

            document.getElementById("titulo").textContent = "Quarto " + quarto.id + " · " + quarto.tipo;
            document.getElementById("info").innerHTML =
                "<div><strong>Valor base:</strong> " + moeda(quarto.valorBase) + "</div>" +
                "<div>Capacidade: " + quarto.capacidade + " hóspede(s)</div>";

            let linhaResidencia = "";
            if (residencia) {
                let endereco = "";
                if (residencia.endereco) {
                    endereco = residencia.endereco;
                }
                if (residencia.numero) {
                    endereco += ", " + residencia.numero;
                }
                let bairro = "";
                if (residencia.bairro) {
                    bairro = residencia.bairro;
                }
                linhaResidencia = `<tr><th>Residência</th><td>${endereco} · ${bairro}</td></tr>`;
            }

            document.getElementById("detalhes").innerHTML = `
                <table class="tabela-dados">
                    <tr><th>Tipo</th><td>${quarto.tipo}</td></tr>
                    <tr><th>Ar-condicionado</th><td>${sim(quarto.possuiAR)}</td></tr>
                    <tr><th>Hidromassagem</th><td>${sim(quarto.possuiHidro)}</td></tr>
                    <tr><th>Capacidade</th><td>${quarto.capacidade} hóspede(s)</td></tr>
                    ${linhaResidencia}
                </table>`;
        }

        carregar();
    </script>

</body>
</html>
