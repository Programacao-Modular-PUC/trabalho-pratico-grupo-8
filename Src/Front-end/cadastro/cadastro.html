<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pousadas de Maraú - Criar Conta</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

    <div class="conteudo">
        <div class="caixa">
            <div class="caixa-titulo">Criar conta</div>

            <form class="formulario" action="../login/login.html" method="get" onsubmit="return validarSenhas()">

                <div class="linha">
                    <div class="campo">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>
                    <div class="campo">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf"
                               placeholder="000.000.000-00" maxlength="14" required>
                    </div>
                </div>

                <div class="linha">
                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" name="telefone"
                               placeholder="(00) 00000-0000" required>
                    </div>
                </div>

                <div class="campo">
                    <label for="endereco">Endereço</label>
                    <input type="text" id="endereco" name="endereco"
                           placeholder="Rua, número" required>
                </div>

                <div class="linha-quatro">
                    <div class="campo">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" name="bairro" required>
                    </div>
                    <div class="campo">
                        <label for="cep">CEP</label>
                        <input type="text" id="cep" name="cep"
                               placeholder="00000-000" required>
                    </div>
                    <div class="campo">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="cidade" required>
                    </div>
                    <div class="campo">
                        <label for="uf">UF</label>
                        <input type="text" id="uf" name="uf" maxlength="2" required>
                    </div>
                </div>

                <div class="linha">
                    <div class="campo">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" required>
                    </div>
                    <div class="campo">
                        <label for="confirmar">Confirmar senha</label>
                        <input type="password" id="confirmar" name="confirmar" required>
                    </div>
                </div>

                <div id="aviso" class="mensagem mensagem-erro" style="display:none;">
                    As senhas não conferem.
                </div>

                <div class="acoes">
                    <button type="submit" class="botao botao-principal">Cadastrar</button>
                    <a href="../login/login.html" class="botao">Cancelar</a>
                </div>

            </form>
        </div>
    </div>

    <script>
        function validarSenhas() {
            var senha = document.getElementById("senha").value;
            var confirmar = document.getElementById("confirmar").value;
            var aviso = document.getElementById("aviso");

            if (senha !== confirmar) {
                aviso.style.display = "block";
                return false;
            }
            aviso.style.display = "none";
            return true;
        }
    </script>

</body>
</html>
